<!DOCTYPE html>
<html lang="de">

<head>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!--Aus dem Internet die URL oben / aber man kann es auch über Workspace einbinden link rel="stylesheet" href=../../bootsrap_css/bootstrap.min.css-->
    <title>Uebung4</title>
    
  </head>

</head>

<body class="container">
  <h1 class="mt-3">Teilnehmerin Regestrierung</h1>

  <div class="row">


    <div class="col-md-6 col-md-4 col-xl-2">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="firstNameId" placeholder="Vorname">
        <label for="firstNameId">Vorname</label>
      </div>
    </div>

    <div class="col-md-6 col-md-4 col-xl-2">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="lastNameId" placeholder="Nachname">
        <label for="lastNameId">Nachname</label>
      </div>
    </div>


    <div class="col-md-6 col-md-4 col-xl-2">
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
        <label for="floatingInput">Email address</label>
      </div>
    </div>

    <div class="col-md-6 col-md-4 col-xl-2">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingPassword" placeholder="Password">
        <label for="floatingPassword">Password</label>
      </div>
    </div>

  </div>

  <div class="row">
    <div class="d-grid gap-4 d-md-block">
      <button type="button" class="btn btn-secondary">Abrechen</button>
      <button type="button" class="btn btn-success" onclick="register()">Speichern</button>
    </div>
  </div>





</body>
<footer>

</footer>

</html>

<script>

  function register(){

    console.log ('Speichern-Button geklickt')
    const inputElementFirstName = document.querySelector('#firstNameId'); //wir holen html Element mit allen Eigenschaften (also die ganze Zeile) (objekt) als Input 
    console.log('inputElementFirstName ', inputElementFirstName)
    const firstName = inputElementFirstName.value //Value holen   
    console.log('firstname: ', firstName)

  }
</script>
