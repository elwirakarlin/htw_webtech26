function makeRequest(file) {
    return new Promise( (resolve, reject) => {
        console.log('making request for ' + file);
        if(file == 'index.html') {
            resolve('index.html exists')
        } else {
            reject(file + ' does not exist')
        }
    });
}

//Promise immer erfolgreich, ohne reject, keien Fallunterscheidung
function processRequest(response) { //response kommt aus dem Promis aus der Ausgabe von resole Fall 
    return new Promise( (resolve, reject) => {
        console.log('processing response');
        resolve('processing done for ' + response)
    })
}

function testPromises(file) {
    makeRequest(file)   //Anfrage stellen          // resolve-Fall
    .then( response => {            //.then (response), wenn der Resolve Fall aufgerufen wird
        console.log('response received');
        console.log(response)       //ausgeben, was wir übergeben bekommen haben
        return processRequest(response) //Rückgabe ist, Ausgabe eine weiteren Funktion
    })
    .then( processedResponse => { //Resolve Fall Wert von process Request Funktion, hier wird direkt neue Variabls "processedResponse" erstellt mit dem übergebenem Wert
        console.log(processedResponse)
    })
    .catch( error => console.log("Fehler : ", error)) //reject- Fall, unten, egal welche Promis, wenn ich unterscheiden will, dann zwischen drin
    //error als Variable wird über die Funktion erstellt 
}

testPromises('index1.html')

        }

        console.log("body : ", body)
